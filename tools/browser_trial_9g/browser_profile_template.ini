# Browser-donor A/B profile based on the frozen owned_apply cadence/quotas.
# The lifecycle binds remote plan/ledger/control/log/lock paths per phase and
# fixes daily_disk_whole_work_mb to the reviewed 8192 MiB browser cap.
[daemon]
cgroup_root=/dev/memcg
proc_root=/proc
log_dir=/data/local/tmp/browser_trial_TEMPLATE/logs
lock_file=/data/local/tmp/browser_trial_TEMPLATE/daemon.lock
control_file=/data/local/tmp/browser_trial_TEMPLATE/control.conf
oracle_mode=false
oracle_proof_source=legacy
daily_async=true
daily_recent_reserve=false
daily_known_strength=true
daily_known_capacity=true
daily_known_lead_sec=90
daily_known_future_free_only=true
daily_known_plan_file=/data/local/tmp/browser_trial_TEMPLATE/browser_event_plan.tsv
daily_known_evidence_ledger=/data/local/tmp/browser_trial_TEMPLATE/browser_evidence.tsv
daily_recent_window_sec=30
daily_recent_hold_sec=60
daily_recent_cap_fraction=0.5
daily_owned_os_snapshot=true
daily_browser_donor_profile=true
daily_disk_mode=owned_apply
daily_disk_whole_work_mb=8192
daily_max_submissions=0
harmony_smaps_interval_ms=30000
interval_ms=200
reserve_mb=1024
ready_free_mb=256
hysteresis_mb=128
horizon_sec=5
startup_grace_sec=30
cooldown_sec=10
backoff_sec=30
min_batch_mb=64
batch_mb=1536
max_per_minute_mb=40960
app_per_minute_mb=8192
swap_reserve_mb=1024
require_psi=false
log_max_mb=32

[app browser]
path=100/com.huawei.hmos.browser_20020064
reclaim=true
min_keep_mb=512
