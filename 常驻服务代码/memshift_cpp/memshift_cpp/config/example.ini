# All sizes named *_mb are MiB (1024*1024 bytes), not decimal MB.
# This file does NOT enable reclaim. Kernel writes require --apply.
# Replace app paths with the actual cgroup v2 paths on the target HOST.
[daemon]
cgroup_root=/sys/fs/cgroup
proc_root=/proc
log_dir=./logs
lock_file=./memshiftd.lock
control_file=./runtime/control.conf
interval_ms=1000

# Two distinct reserves: MemAvailable includes reclaimable cache; MemFree does not.
reserve_mb=1024
ready_free_mb=256
hysteresis_mb=128
horizon_sec=5
max_decline_mb_s=256
max_boost_mb=4096

# Conservative opt-in donor policy; not an actual WSS predictor.
alpha=0.20
anon_weight=0.50
keep_ratio=0.70
episode_fraction=0.20
startup_grace_sec=30
cooldown_sec=3
backoff_sec=30
min_batch_mb=8
batch_mb=64
max_per_minute_mb=1024
app_per_minute_mb=256

# -1 omits swappiness= for older/backported memory.reclaim interfaces.
# Kernel support for a nonnegative override is NOT proven by --check.
swappiness=-1
allow_anon_hint=true
swap_reserve_mb=256
require_psi=true
io_some_limit_pct=5
memory_full_limit_pct=2
app_some_limit_pct=2
growth_guard_mb_s=8
refault_guard_mb_s=1
major_guard_per_s=64
log_max_mb=32

# Explicit background donors only. Do not use user.slice or system.slice wholesale.
[app background_a]
path=memtest.slice/background-a.service
reclaim=true
min_keep_mb=512

[app background_b]
path=memtest.slice/background-b.service
reclaim=true
min_keep_mb=512

# Always sampled but NEVER reclaimed by this daemon, even if runtime control is empty.
[app editor]
path=memtest.slice/editor.service
reclaim=false
min_keep_mb=512
